name: Build mod
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Forge MDK 1.21.4
        run: |
          V=$(curl -s https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json | jq -r '.promos["1.21.4-latest"]')
          echo "Forge version: $V"
          curl -fL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.4-$V/forge-1.21.4-$V-mdk.zip"
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Add mod sources
        run: |
             ls -la
             unzip -q "$(ls *.zip | grep -v '^mdk.zip$' | head -n 1)" -d pkg
             rm -rf mdk/src/main/java
             cp -r pkg/purpleclient/src/main/java mdk/src/main/java
             cp -r pkg/purpleclient/src/main/resources/. mdk/src/main/resources/
             sed -i 's/^mod_id=.*/mod_id=purpleclient/; s/^mod_name=.*/mod_name=Purple Client/; s/^mod_group_id=.*/mod_group_id=com.purple.client/' mdk/gradle.properties

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: purpleclient-mod
          path: mdk/build/libs/*.jar
