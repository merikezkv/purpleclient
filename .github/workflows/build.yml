name: Build mod
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Unpack sources
        run: |
          ls -la
          unzip -q "$(ls *.zip | head -n 1)" -d pkg

      - name: Build
        working-directory: pkg/purpleclient
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: purpleclient-mod
          path: pkg/purpleclient/build/libs/*.jar
